<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARRINHO</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <h1>CARRINHO DE COMPRAS</h1>
    <div class="area">
        <div class="compra">
            <span>PRODUTOS</span>
            <div class="shop">

                <div class="cont">

                    <div class="shop-img"></div>

                    <div class="cont-shop">
                        <div class="item-name">Calça Jeans</div>
                        <div class="item-price">R$ 20,00</div>
                    </div>

                </div>

                <button class="btnAdd">ADICIONAR</button>
            </div>
        </div>

        <div class="cont-car">
            <div class="carrinho">
                <span>CARRINHO</span>
                <div class="item-car">Seu carrinho está vazio 🛒</div>
                <div class="total">
                    <span>Total:</span>
                    <span id="total-price">R$ 00.00</span>
                </div>
                <div class="btnEnd"><button>Finanalizar compra</button></div>
            </div>
        </div>
    </div>
    <script src="assets/script.js"></script>
</body>
</html>
